version: 2

# Without grouping, dependabot opens one pull request per dependency per
# manifest — a framework bump shared by the root and three packages arrives as
# four. Each merge to main also publishes a release, so an ungrouped batch
# becomes a batch of releases for changes that never reach a consumer: the
# published packages declare no runtime dependencies, and everything below is
# development-only.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # One entry covers every workspace, so a dependency shared by the root and
    # the packages is bumped in one pull request rather than one per manifest.
    groups:
      nest:
        patterns:
          - '@nestjs/*'
          - 'nestjs-*'
      typescript-toolchain:
        patterns:
          - 'typescript'
          - 'ts-*'
          - '@types/*'
          - 'eslint*'
          - '@typescript-eslint/*'
          - 'prettier*'
          - 'jest*'
      # Everything else, so a lone transitive security fix still gets through
      # instead of waiting on a group it does not belong to.
      remaining:
        patterns:
          - '*'
    # These majors are held back deliberately. A grouped pull request installs
    # as one tree, so a single dependency that cannot resolve fails the whole
    # batch before anything compiles — holding one is what lets the dozen
    # beside it through.
    #
    # A hold is more durable than closing the pull request it produces. Closing
    # one suppresses that exact version, so the next patch release reopens it
    # and the same decision has to be made again from memory.
    #
    # Each hold names the condition that ends it. Review one by deleting its
    # entry and letting the group rebuild.
    ignore:
      # `typescript` 7 has no lint toolchain yet: the newest
      # `@typescript-eslint` still declares `typescript >=4.8.4 <6.1.0` as a
      # peer, so npm refuses the tree outright. Drop this once
      # `@typescript-eslint` publishes a release whose peer range admits 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      # `@types/node` must describe a runtime this project actually tests. The
      # CI matrix runs the maintained LTS lines, and the next major does not
      # reach LTS until late October 2026 — typing against it first reports
      # errors for APIs no supported runtime here provides. Drop this once the
      # matrix gains that line.
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # `typeorm` 1.x cannot be installed while a pagination helper this
      # repository depends on still declares `typeorm: ^0.3.0` as its peer.
      # The constraint is upstream and not ours to fix; holding it keeps the
      # rest of its group moving. Drop this once that peer range admits 1.x.
      - dependency-name: 'typeorm'
        update-types:
          - 'version-update:semver-major'
    commit-message:
      # `chore` keeps these out of the changelog's feature and fix sections.
      # They still trigger a patch release, which is correct: the manifests
      # changed, even if only for development.
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: ci
