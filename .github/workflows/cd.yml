name: Publish packages

# The channel is chosen by a flag at publish time, not by which branch the work
# lives on. Tying a channel to a long-lived branch is what made `develop` drift
# from `main` twice, each time cutting prereleases below the stable they came
# from — and the beta channel never caught anything the feature branch had not
# already surfaced.
on:
  pull_request:
    branches:
      - main
    types: [closed]
  workflow_dispatch:
    inputs:
      action:
        description: 'What to publish'
        type: choice
        options:
          - prerelease
          - missing
          - remove-tag
        default: prerelease
      channel:
        description: 'npm dist-tag to publish under, or to remove with remove-tag'
        type: string
        default: next
      preid:
        description: 'Prerelease identifier used in the version'
        type: string
        default: next

jobs:
  # Every publish job needs this one, so gating it here stops the whole
  # workflow rather than each job separately.
  #
  # A pull request that is closed without merging fires the same event as one
  # that ships, and there is no way to tell them apart from the `on:` block —
  # `types: [closed]` covers both. Without this condition, abandoning a pull
  # request spends a full matrix run to reach a publish step that was always
  # going to skip, and a stale branch can fail that run for reasons nobody
  # intends to fix.
  test:
    if: (github.event_name == 'workflow_dispatch' && inputs.action != 'remove-tag') || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      # Both maintained LTS lines. The matrix was previously declared but never
      # wired into setup-node, so this gate ran on whatever the runner defaulted
      # to — it never pinned a version at all.
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  publish_stable:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    needs: test
    concurrency:
      # A publish takes minutes. A second merge inside that window advances
      # main under this job's checkout, and lerna aborts with EBEHIND before
      # publishing anything.
      #
      # Never cancel: a half-finished publish can leave a version tagged in git
      # but absent from the registry, which then needs manual recovery.
      # Queuing only costs time.
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the branch, not the SHA that triggered the run. `lerna
          # version` pushes a release commit, so a re-run of this job would
          # otherwise land behind the remote and abort with EBEHIND.
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Setup
        run: |
          git config --global user.name "${{github.actor}}"
          git config --global user.email "${{github.actor}}@users.noreply.github.com"
          git remote set-url origin https://github.com/${{github.repository}}.git
      - name: Build
        run: |
          npm ci
          npm run build
      # Versioning and publishing are separate steps on purpose. If the publish
      # fails, re-running the job is safe: the version step finds nothing to
      # bump and the publish step uploads whatever is missing from the registry.
      - name: Version
        run: npm run version:stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        run: npm run publish:stable
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # On-demand prerelease from whatever branch is dispatched. Leaves no commit
  # and no tag: a prerelease is a throwaway artefact for someone to install and
  # try, and the release history should record only what reached `latest`.
  publish_prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'prerelease'
    needs: test
    concurrency:
      # A publish takes minutes. A second merge inside that window advances
      # main under this job's checkout, and lerna aborts with EBEHIND before
      # publishing anything.
      #
      # Never cancel: a half-finished publish can leave a version tagged in git
      # but absent from the registry, which then needs manual recovery.
      # Queuing only costs time.
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # Full history: lerna reads the last release tag to compute the bump.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Build
        run: |
          npm ci
          npm run build
      # Both dist-tag flags are set to the same value on purpose: `--dist-tag`
      # covers the general case and `--pre-dist-tag` the prerelease one, so the
      # artefact cannot land on `latest` through whichever lerna consults.
      - name: Publish prerelease
        run: |
          npm run publish:prerelease -- \
            --preid "${{ inputs.preid }}" \
            --dist-tag "${{ inputs.channel }}" \
            --pre-dist-tag "${{ inputs.channel }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Recovery. Publishes any package whose version is already committed and
  # tagged but never reached the registry, without versioning anything.
  publish_missing:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'missing'
    needs: test
    concurrency:
      # A publish takes minutes. A second merge inside that window advances
      # main under this job's checkout, and lerna aborts with EBEHIND before
      # publishing anything.
      #
      # Never cancel: a half-finished publish can leave a version tagged in git
      # but absent from the registry, which then needs manual recovery.
      # Queuing only costs time.
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Publish missing versions
        run: npm run publish:missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Removes a dist-tag from every package. A prerelease channel outlives the
  # artefact it pointed at: the version stays in the registry forever, but the
  # tag keeps advertising it as the current one for that channel, and installing
  # by tag then silently returns something far behind `latest`.
  #
  # Publishing is the only path with registry credentials, so retiring a channel
  # belongs here rather than in someone's shell.
  remove_tag:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'remove-tag'
    concurrency:
      # Shares the publish group so a removal cannot land between a publish
      # setting a tag and the version it points at, and delete what was just set.
      group: publish-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # `latest` is what a plain `npm install` resolves, so removing it would
      # leave the package uninstallable without an explicit version.
      - name: Remove the dist-tag from every package
        run: |
          if [ "${{ inputs.channel }}" = "latest" ]; then
            echo "::error::latest cannot be removed"
            exit 1
          fi
          for manifest in packages/*/package.json; do
            name=$(node -p "require('./$manifest').name")
            npm dist-tag rm "$name" "${{ inputs.channel }}" \
              || echo "$name has no ${{ inputs.channel }} tag, nothing to remove"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
