# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
      contents: write

    runs-on: ubuntu-latest

    strategy:
      # Both maintained LTS lines. These packages are consumed by applications
      # that will straddle them, so a single-version matrix would leave whichever
      # one it omits untested. See https://nodejs.org/en/about/releases/
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v7
      - uses: jwalton/gh-find-current-pr@v1
        id: findPr

      - name: Installing dependiencies using Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci

      - run: npm run typecheck

      # The coverage action posts a pull request comment, so it runs on one
      # matrix entry only — otherwise every pull request gets a duplicate report.
      # The other entry still runs the suite, through the same action.
      - name: Running tests with coverage
        uses: ArtiomTr/jest-coverage-report-action@v2
        with:
          skip-step: install
          annotations: failed-tests
          prnumber: ${{ steps.findPr.outputs.number }}
          output: ${{ matrix.node-version == '22.x' && 'comment' || 'report-markdown' }}
